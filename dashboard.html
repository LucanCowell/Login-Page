<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container" style="text-align: center;">
        <h1 class="formTitle">Welcome Back, <span id="userGreeting" style="color: var(--colorPrimary);">User</span>!</h1>
        <p class="formText" style="margin-bottom: 2rem;">This is your secure, unique application dashboard.</p>
        
        <button id="btnLogout" class="formButton" type="button">Log Out</button>
    </div>

    <script>
        const token = localStorage.getItem("userToken");
        const username = localStorage.getItem("username");

        if (!token || !username) {
            alert("Access Denied! Please log in first.");
            window.location.href = "./index.html";
        } else {
            document.querySelector("#userGreeting").textContent = username;
        }
        document.querySelector("#btnLogout").addEventListener("click", () => {
            localStorage.removeItem("userToken");
            localStorage.removeItem("username");
            window.location.href = "./index.html";
        });
    </script>

    
</body>
</html>
